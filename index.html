<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGARDEN | sasami</title>
  <meta name="description" content="仮想通貨に関する情報発信。便利なツールや自分のポストをまとめたものを掲載しています。">
  <meta property="og:title" content="AIGARDEN | sasami">
  <meta property="og:description" content="仮想通貨に関する情報発信。便利なツールや自分のポストをまとめています。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai-garden-lab.com/">
  <meta property="og:image" content="https://ai-garden-lab.com/images/ogp.png">
  <meta property="og:site_name" content="AIGARDEN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@neko_smg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f5f6f4;
      --ink:   #15181a;
      --muted: #6b7370;
      --line:  #dcdfda;
      --accent: #0d5f66;
      --accent-soft: rgba(13,95,102,0.06);
      --signal: #c8401c;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans JP', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(860px, calc(100% - 44px)); margin: 0 auto; }

    /* ─── HEADER ─── */
    header {
      width: 100%;
      border-bottom: 1.5px solid var(--ink);
      padding: 16px 0;
      background: var(--paper);
    }
    .header-nav { }
    .nav-inner {
      width: min(860px, calc(100% - 44px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.13em;
      color: var(--ink);
      border: 1.5px solid var(--ink);
      padding: 7px 14px;
      transition: background 0.18s, color 0.18s;
    }
    .brand:hover { background: var(--ink); color: #fff; }
    .brand-by { font-weight: 400; opacity: 0.6; }

    /* ─── MAIN ─── */
    main { padding: 56px 0 0; }

    /* プロフィール */
    .profile {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 44px;
    }
    .profile-icon {
      width: 80px; height: 80px;
      flex-shrink: 0;
      border: 1.5px solid var(--ink);
      overflow: hidden;
    }
    .profile-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-name {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .profile-bio {
      font-size: 15px;
      color: #3d423f;
      line-height: 1.95;
      max-width: 540px;
      margin-bottom: 16px;
    }
    .profile-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .profile-links a {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      border: 1px solid var(--ink);
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.18s, color 0.18s;
    }
    .profile-links a:hover {
      background: var(--ink);
      color: #fff;
    }

    /* セクションタイトル */
    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    /* コンテンツカード */
    .card-list {
      border: 1.5px solid var(--ink);
      background: #fff;
      margin-bottom: 56px;
    }
    .card {
      display: grid;
      grid-template-columns: 50px 1fr 24px;
      align-items: center;
      gap: 0 24px;
      padding: 24px;
      border-top: 1px solid var(--line);
      position: relative;
      transition: background 0.18s;
    }
    .card:first-child { border-top: none; }
    .card:hover { background: var(--accent-soft); }
    .card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.2s;
    }
    .card:hover::before { transform: scaleY(1); }

    .card-icon {
      width: 50px; height: 50px;
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: var(--paper);
      transition: border-color 0.18s;
    }
    .card:hover .card-icon { border-color: var(--accent); }
    .card-icon svg { stroke: var(--ink); transition: stroke 0.18s; }
    .card:hover .card-icon svg { stroke: var(--accent); }

    .card-body {}
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.75;
    }
    .card-arrow {
      font-family: var(--mono);
      font-size: 20px;
      color: var(--muted);
      text-align: right;
      transition: transform 0.2s, color 0.18s;
    }
    .card:hover .card-arrow {
      transform: translateX(5px);
      color: var(--accent);
    }

    /* ─── FOOTER ─── */

    footer {
      border-top: 1px solid var(--line);
      padding: 20px 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      .profile { flex-direction: column; gap: 16px; }
      .profile-name { font-size: 24px; }
      .card { grid-template-columns: 42px 1fr 20px; gap: 0 14px; padding: 18px 16px; }
      .footer-profile { flex-direction: column; text-align: center; padding: 14px 20px; gap: 12px; white-space: normal; }
      .footer-links { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-nav">
      <div class="nav-inner">
        <a href="/" class="brand">
          AIGARDEN <span class="brand-by">BY SASAMI</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- プロフィール -->
      <div class="profile">
        <div class="profile-icon">
          <img src="../images/pfp.png" alt="sasami" />
        </div>
        <div>
          <div class="profile-name">sasami</div>
          <p class="profile-bio">
            仮想通貨に関する情報発信をしています。<br>
            エアドロップ調査・プロジェクトリサーチなど、自分が実際に調べたことをまとめたリサーチページや、FDV計算・AIプロンプト集など便利なツールを掲載しています。<br>
          </p>
          <div class="profile-links">
            <a href="https://x.com/neko_smg" target="_blank" rel="noopener">X / Twitter ↗</a>
            <a href="https://note.com/" target="_blank" rel="noopener">note ↗</a>
          </div>
        </div>
      </div>

      <!-- コンテンツ -->
      <div class="section-label">Contents</div>
      <div class="card-list">

        <a href="/crypto/" class="card">
          <div class="card-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <div class="card-body">
            <div class="card-title">Crypto Tools</div>
            <div class="card-desc">FDV計算、AIプロンプト集、Prediction、Researchなど仮想通貨に役立つ無料ツール集。</div>
          </div>
          <div class="card-arrow">›</div>
        </a>

      </div>

    </div>
  </main>

  <footer>
    <div class="container">© 2026 AIGARDEN.</div>
  </footer>

</body>
</html>
