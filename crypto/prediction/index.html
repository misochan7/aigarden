<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy"
content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src https://gamma-api.polymarket.com; style-src 'self' 'unsafe-inline';">
<title>Polymarket Dashboard</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3e;--text:#e2e8f0;--muted:#8892a4;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--purple:#a855f7;--teal:#14b8a6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:14px;}
header{padding:16px 24px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
header h1{font-size:18px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;}
#refresh-btn{background:var(--blue);color:white;}
#refresh-btn:hover{opacity:0.85;}
#lang-btn{background:#2a2d3e;color:var(--text);border:1px solid var(--border);font-weight:600;letter-spacing:0.04em;}
#lang-btn:hover{background:#3a3d5e;}
.tabs{display:flex;gap:4px;padding:16px 24px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.tab-btn{padding:8px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;font-size:13px;font-weight:500;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tab-btn.active{color:var(--text);border-bottom:2px solid var(--blue);background:rgba(59,130,246,0.08);}
.tab-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.04);}
.tab-icon{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.tab-icon-crypto{background:linear-gradient(135deg,#f7931a,#e8830a);color:#fff;}
.tab-icon-tge{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;}
.tab-icon-war{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;}
.tab-icon-commodity{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;}
.tab-content{display:none;padding:20px 24px;}
.tab-content.active{display:block;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:border-color 0.15s;}
.card:hover{border-color:#3a3d5e;}
.card-title{font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.4;}
.card-title a{color:var(--text);text-decoration:none;}
.card-title a:hover{color:var(--blue);}
.market-row{display:flex;align-items:center;margin-bottom:8px;gap:8px;}
.market-label{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prob{font-size:13px;font-weight:700;width:44px;text-align:right;flex-shrink:0;}
.bar-wrap{flex:1;height:5px;background:#2a2d3e;border-radius:3px;overflow:hidden;}
.bar{height:100%;border-radius:3px;transition:width 0.4s;}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);gap:4px;flex-wrap:wrap;}
.vol-badge{background:rgba(59,130,246,0.12);color:var(--blue);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;}
.days-badge{background:rgba(168,85,247,0.12);color:var(--purple);border-radius:4px;padding:2px 6px;font-size:11px;}
.loading{text-align:center;padding:60px;color:var(--muted);font-size:15px;}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);padding:8px 0 8px;margin-top:8px;border-bottom:1px solid var(--border);margin-bottom:14px;}
</style>
</head>
<body>

<header>
<h1>📊 Polymarket Dashboard</h1>
<div class="header-right">
<button id="lang-btn" class="btn" onclick="toggleLang()">EN</button>
<button id="refresh-btn" class="btn" onclick="loadAll()">🔄 <span id="refresh-label"></span></button>
</div>
</header>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('tab-btc',this)">
  <span class="tab-icon tab-icon-crypto">₿</span>
  <span data-i18n="tab_btc"></span>
</button>
<button class="tab-btn" onclick="switchTab('tab-tge',this)">
  <span class="tab-icon tab-icon-tge">🚀</span>
  <span data-i18n="tab_tge"></span>
</button>
<button class="tab-btn" onclick="switchTab('tab-pol',this)">
  <span class="tab-icon tab-icon-war">🌏</span>
  <span data-i18n="tab_pol"></span>
</button>
<button class="tab-btn" onclick="switchTab('tab-com',this)">
  <span class="tab-icon tab-icon-commodity">💹</span>
  <span data-i18n="tab_com"></span>
</button>
</div>

<div id="tab-btc" class="tab-content active"></div>
<div id="tab-tge" class="tab-content"></div>
<div id="tab-pol" class="tab-content"></div>
<div id="tab-com" class="tab-content"></div>

<script>
// ---- i18n ----
const I18N = {
  ja: {
    tab_btc: 'BTC / ETH 価格予想',
    tab_tge: 'TGE前トークン',
    tab_pol: '戦争・政治',
    tab_com: 'コモディティ',
    refresh: '更新',
    loading: '読み込み中...',
    nodata: 'データなし',
    vol: '出来高 ',
    ended: '終了',
    today: '本日',
    days_left: '日残り',
    markets_unit: '件',
    error: 'エラー: ',
    sec_bitcoin: 'Bitcoin',
    sec_ethereum: 'Ethereum',
    sec_pre: 'TGE / Pre-Market',
    sec_geo: '地政学',
    sec_iran: 'イラン',
    sec_ukraine: 'ウクライナ',
    sec_economy: 'エコノミー',
    sec_oil: '原油 / コモディティ',
    sec_commodities: '商品先物',
    sec_stocks: '株式',
  },
  en: {
    tab_btc: 'BTC / ETH Price',
    tab_tge: 'Pre-TGE Tokens',
    tab_pol: 'War & Politics',
    tab_com: 'Commodities',
    refresh: 'Refresh',
    loading: 'Loading...',
    nodata: 'No data',
    vol: 'Vol ',
    ended: 'Ended',
    today: 'Today',
    days_left: 'd left',
    markets_unit: ' mkts',
    error: 'Error: ',
    sec_bitcoin: 'Bitcoin',
    sec_ethereum: 'Ethereum',
    sec_pre: 'TGE / Pre-Market',
    sec_geo: 'Geopolitics',
    sec_iran: 'Iran',
    sec_ukraine: 'Ukraine',
    sec_economy: 'Economy',
    sec_oil: 'Oil / Commodities',
    sec_commodities: 'Commodities Futures',
    sec_stocks: 'Stocks',
  }
};

// ---- Exclude short-term / noise keywords ----
const EXCLUDE_KW = [
  '5min','15min','1-hour','4-hour','daily candle',
  'up or down daily','up or down 5','up or down 15','up or down 4','up or down 1-',
  'btc up or down','eth up or down',
];

// ---- Tab config: tag_slug is the correct API param ----
const TABS = {
  'tab-btc': [
    {secKey:'sec_bitcoin',   tagSlug:'bitcoin',     minVol:500000},
    {secKey:'sec_ethereum',  tagSlug:'ethereum',    minVol:500000},
  ],
  'tab-tge': [
    {secKey:'sec_pre',       tagSlug:'pre-market',  minVol:0},
  ],
  'tab-pol': [
    {secKey:'sec_geo',       tagSlug:'geopolitics', minVol:500000},
    {secKey:'sec_iran',      tagSlug:'iran',        minVol:500000},
    {secKey:'sec_ukraine',   tagSlug:'ukraine',     minVol:500000},
    {secKey:'sec_economy',   tagSlug:'economy',     minVol:500000},
  ],
  'tab-com': [
    {secKey:'sec_oil',        tagSlug:'oil',         minVol:0},
    {secKey:'sec_commodities',tagSlug:'commodities', minVol:0},
    {secKey:'sec_stocks',     tagSlug:'stocks',      minVol:500000},
  ],
};

let lang = localStorage.getItem('pm_lang') || 'ja';
let refreshTimer = null;
const REFRESH_MS = 60 * 60 * 1000;

function t(k){ return I18N[lang][k] || k; }

function applyLang(){
  document.getElementById('lang-btn').textContent = lang === 'ja' ? 'EN' : 'JA';
  document.getElementById('refresh-label').textContent = t('refresh');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
}

function toggleLang(){
  lang = lang === 'ja' ? 'en' : 'ja';
  localStorage.setItem('pm_lang', lang);
  applyLang();
  // Re-render section labels
  document.querySelectorAll('[data-sec-key]').forEach(el => {
    el.textContent = t(el.dataset.secKey);
  });
}

function switchTab(id, btn){
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function barColor(p){
  if(p >= 70) return 'var(--green)';
  if(p >= 40) return 'var(--yellow)';
  return 'var(--red)';
}

function fmtVol(v){
  v = parseFloat(v) || 0;
  if(v >= 1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if(v >= 1e6) return '$'+(v/1e6).toFixed(1)+'M';
  if(v >= 1e3) return '$'+(v/1e3).toFixed(0)+'K';
  return '$'+v.toFixed(0);
}

function fmtDays(end){
  if(!end) return '';
  const d = Math.round((new Date(end)-Date.now())/86400000);
  if(d < 0) return t('ended');
  if(d === 0) return t('today');
  return d + t('days_left');
}

function isExcluded(title){
  const tl = (title||'').toLowerCase();
  return EXCLUDE_KW.some(kw => tl.includes(kw));
}

async function fetchSection(tagSlug, minVol){
  const p = new URLSearchParams({
    tag_slug: tagSlug,
    limit: '50',
    order: 'volume',
    ascending: 'false',
    active: 'true',
  });
  if(minVol > 0) p.set('volume_num_min', String(minVol));
  const res = await fetch('https://gamma-api.polymarket.com/events?'+p);
  if(!res.ok) throw new Error(res.status+' '+res.statusText);
  return res.json();
}

function buildCard(ev){
  const title = ev.title || ev.slug || '';
  if(isExcluded(title)) return null;

  const slug = ev.slug || ev.id;
  const url = 'https://polymarket.com/event/'+slug;
  const markets = Array.isArray(ev.markets) ? ev.markets : [];
  const vol = parseFloat(ev.volume) || 0;
  const endDate = ev.endDate;

  // Parse outcomePrices — stored as JSON string in API
  function getProb(m){
    try {
      const prices = typeof m.outcomePrices === 'string'
        ? JSON.parse(m.outcomePrices)
        : (Array.isArray(m.outcomePrices) ? m.outcomePrices : []);
      return Math.round(parseFloat(prices[0] || 0) * 100);
    } catch(e){ return 0; }
  }

  const sorted = [...markets]
    .sort((a,b) => getProb(b) - getProb(a))
    .slice(0, 4);

  let rowsHTML = '';
  sorted.forEach(m => {
    const prob = getProb(m);
    const color = barColor(prob);
    const label = m.groupItemTitle || m.question || '';
    const safeLabel = label.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    rowsHTML += '<div class="market-row">'
      + '<span class="market-label" title="'+safeLabel+'">'+safeLabel+'</span>'
      + '<div class="bar-wrap"><div class="bar" style="width:'+prob+'%;background:'+color+'"></div></div>'
      + '<span class="prob" style="color:'+color+'">'+prob+'%</span>'
      + '</div>';
  });

  if(!rowsHTML){
    const safeTitle = title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    rowsHTML = '<div class="market-row">'
      + '<span class="market-label">'+safeTitle+'</span>'
      + '<div class="bar-wrap"><div class="bar" style="width:50%;background:var(--blue)"></div></div>'
      + '<span class="prob" style="color:var(--blue)">—</span>'
      + '</div>';
  }

  const safeTitle = title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const safeUrl = url.replace(/"/g,'&quot;');

  return '<div class="card">'
    + '<div class="card-title"><a href="'+safeUrl+'" target="_blank" rel="noopener">'+safeTitle+'</a></div>'
    + rowsHTML
    + '<div class="card-footer">'
    + '<span class="vol-badge">'+t('vol')+fmtVol(vol)+'</span>'
    + '<span>'+markets.length+t('markets_unit')+'</span>'
    + '<span class="days-badge">'+fmtDays(endDate)+'</span>'
    + '</div></div>';
}

async function loadTab(tabId){
  const sections = TABS[tabId];
  const container = document.getElementById(tabId);
  if(!sections || !container) return;

  container.innerHTML = '<div class="loading"><span class="spinner"></span>'+t('loading')+'</div>';

  try {
    const seen = new Set();
    const frag = document.createDocumentFragment();

    for(const sec of sections){
      let events;
      try { events = await fetchSection(sec.tagSlug, sec.minVol); }
      catch(e){ continue; }

      const cards = events
        .filter(ev => {
          const k = ev.slug || ev.id;
          if(seen.has(k)) return false;
          seen.add(k);
          return true;
        })
        .map(buildCard)
        .filter(Boolean);

      if(!cards.length) continue;

      const secLabel = document.createElement('div');
      secLabel.className = 'section-label';
      secLabel.dataset.secKey = sec.secKey;
      secLabel.textContent = t(sec.secKey);

      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.innerHTML = cards.join('');

      frag.appendChild(secLabel);
      frag.appendChild(grid);
    }

    container.innerHTML = '';
    if(frag.childNodes.length === 0){
      container.innerHTML = '<div class="loading">'+t('nodata')+'</div>';
    } else {
      container.appendChild(frag);
    }
  } catch(e){
    container.innerHTML = '<div class="loading">'+t('error')+e.message+'</div>';
  }
}

function loadAll(){
  clearTimeout(refreshTimer);
  Object.keys(TABS).forEach(id => loadTab(id));
  refreshTimer = setTimeout(loadAll, REFRESH_MS);
}

document.addEventListener('DOMContentLoaded', () => {
  applyLang();
  loadAll();
});
</script>
</body>
</html>
