<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediction | Crypto Tools</title>
  <meta name="description" content="BTC/ETH価格予想、TGE前トークン、戦争・政治・コモディティの予測市場を一画面に。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════
       BASE — トップページと共通
    ═══════════════════════════════════════ */
    :root {
      --bg: #f4f2ec;
      --text: #111111;
      --muted: #666666;
      --line: #1e1e1e;
      --accent: #0d5f66;
      --accent-light: rgba(13,95,102,0.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color:inherit; text-decoration:none; }

    .container {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* ═══════════════════════════════════════
       HEADER
    ═══════════════════════════════════════ */
    header {
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text);
      transition: opacity 0.2s;
    }
    .brand:hover { opacity: 0.65; }
    .diamond {
      width: 18px; height: 18px;
      background: var(--accent);
      transform: rotate(45deg);
      flex-shrink: 0;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 13px;
      align-items: center;
    }
    .nav-links a { color: var(--muted); transition: color 0.2s; letter-spacing:0.02em; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); font-weight: 600; }

    /* ═══════════════════════════════════════
       PAGE HERO
    ═══════════════════════════════════════ */
    .page-hero {
      padding: 48px 0 36px;
      border-bottom: 1px solid var(--line);
    }
    .page-hero h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .page-hero .subtitle { color: var(--muted); font-size: 0.9rem; }

    /* ═══════════════════════════════════════
       COMING SOON（準備中）
    ═══════════════════════════════════════ */
    .coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 120px;
      border-bottom: 1px solid var(--line);
    }
    .coming-soon .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 5px 14px;
      margin-bottom: 26px;
    }
    .coming-soon h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }
    .coming-soon p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 460px;
      line-height: 1.9;
    }

    /* ═══════════════════════════════════════
       FOOTER PROFILE — トップページと同一
    ═══════════════════════════════════════ */
    .profile-section {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      padding: 48px 0 64px;
      border-top: 1px solid var(--line);
      margin-top: 40px;
    }
    .profile-icon {
      width: 140px; height: 140px;
      overflow: hidden; flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .profile-icon img {
      width:100%; height:100%;
      object-fit:cover; object-position:center; display:block;
    }
    .profile-section h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: 48px; margin-bottom: 8px;
    }
    .profile-links {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;
    }
    .profile-links a {
      border: 1px solid var(--line);
      padding: 10px 18px; font-size: 13px; transition: all 0.2s;
    }
    .profile-links a:hover { background: var(--text); color: white; }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ═══════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════ */
    @media (max-width: 640px) {
      .nav { flex-wrap: wrap; gap: 12px; }
      .nav-links { order: 3; width: 100%; gap: 16px; font-size: 12px; }
      .page-hero h1 { font-size: 2.4rem; }
      .coming-soon { padding: 70px 20px 90px; }
      .profile-section { flex-direction: column; }
      .profile-icon { width: 96px; height: 96px; }
      .profile-section h2 { font-size: 38px; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header>
    <div class="container nav">
      <a href="/crypto/" class="brand">
        <div class="diamond"></div>
        <span>CRYPTO TOOLS</span>
        <span style="font-weight:400; opacity:.7;">BY SASAMI</span>
      </a>
      <nav class="nav-links">
        <a href="/crypto/fdv/">FDV Calculator</a>
        <a href="/crypto/prompt/">AI Prompts</a>
        <a href="/crypto/prediction/" class="active">Prediction</a>
        <a href="/crypto/research/">Research</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- PAGE HERO -->
      <div class="page-hero">
        <h1>Prediction.</h1>
        <p class="subtitle">Polymarket — 予測市場のリアルタイムダッシュボード。</p>
      </div>

      <!-- ═══════════════ 準備中 ═══════════════ -->
      <div class="coming-soon">
        <span class="badge">Coming Soon</span>
        <h2>準備中</h2>
        <p>このページは現在準備中です。<br>予測市場ダッシュボードは近日公開予定です。もうしばらくお待ちください。</p>
      </div>

      <!-- FOOTER PROFILE -->
      <section class="profile-section">
        <div class="profile-icon">
          <img src="../../images/pfp.png" alt="sasami profile" />
        </div>
        <div>
          <h2>sasami</h2>
          <div class="profile-links">
            <a href="https://x.com/neko_smg" target="_blank">X / Twitter →</a>
            <a href="https://note.com/neko_smg" target="_blank">note →</a>
            <a href="https://ai-garden-lab.com/" target="_blank">AIGARDEN →</a>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <div class="container">© 2026 AIGARDEN Crypto Tools.</div>
  </footer>

</body>
</html>
