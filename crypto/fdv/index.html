        'results.enterTotalSupply': 'Please enter total supply',
        'results.enterPointData': 'Please enter total points and allocation',
        'footer.cryptoTools': 'Crypto Tools'
      }
    };

    let currentLang = 'ja';

    // アコーディオンメニューの開閉
    function toggleMenu() {
      const dropdown = document.getElementById('menuDropdown');
      const toggle = document.querySelector('.menu-toggle');
      dropdown.classList.toggle('show');
      toggle.classList.toggle('open');
    }

    // メニュー外をクリックしたら閉じる
    document.addEventListener('click', function(event) {
      const menu = document.querySelector('.menu-accordion');
      const dropdown = document.getElementById('menuDropdown');
      const toggle = document.querySelector('.menu-toggle');
      
      if (!menu.contains(event.target) && dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
        toggle.classList.remove('open');
      }
    });

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      
      // 言語ボタンの更新
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      // テキストの更新
      document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.getAttribute('data-i18n');
        if (translations[lang][key]) {
          elem.textContent = translations[lang][key];
        }
      });
      
      // プレースホルダーの更新
      document.querySelectorAll('[data-i18n-placeholder]').forEach(elem => {
        const key = elem.getAttribute('data-i18n-placeholder');
        if (translations[lang][key]) {
          elem.placeholder = translations[lang][key];
        }
      });
      
      // 結果を再計算して表示を更新
      calculate();
    }

    const fdvList = [
      { label: '$20M', value: 20000000 },
      { label: '$50M', value: 50000000 },
      { label: '$100M', value: 100000000 },
      { label: '$200M', value: 200000000 },
      { label: '$300M', value: 300000000 },
      { label: '$400M', value: 400000000 },
      { label: '$500M', value: 500000000 },
      { label: '$700M', value: 700000000 },
      { label: '$1B', value: 1000000000 },
      { label: '$2B', value: 2000000000 },
      { label: '$3B', value: 3000000000 },
      { label: '$4B', value: 4000000000 },
      { label: '$5B', value: 5000000000 },
    ];

    let currentMode = 'normal';

    // 通常モード用
    const totalSupplyInput = document.getElementById('totalSupply');
    const holdingsInput = document.getElementById('holdings');

    // ポイントモード用
    const totalSupplyPointInput = document.getElementById('totalSupplyPoint');
    const totalPointsInput = document.getElementById('totalPoints');
    const allocationPointInput = document.getElementById('allocationPoint');
    const myPointsInput = document.getElementById('myPoints');

    const resultsContainer = document.getElementById('resultsContainer');

    function switchTab(mode) {
      currentMode = mode;
      
      // タブボタンの更新
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[mode === 'normal' ? 0 : 1].classList.add('active');
      
      // タブコンテンツの更新
      document.getElementById('normalTab').classList.toggle('active', mode === 'normal');
      document.getElementById('pointTab').classList.toggle('active', mode === 'point');
      
      calculate();
    }

    function parseNumber(str) {
      if (!str) return NaN;
      return parseFloat(str.replace(/,/g, ''));
    }

    function setTotalSupply(inputId, value) {
      document.getElementById(inputId).value = value.toLocaleString('en-US');
      calculate();
    }

    function formatNumber(num, decimals = 2) {
      if (num >= 0.01) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      } else if (num >= 0.0001) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
      } else if (num >= 0.00000001) {
        return num.toFixed(8);
      } else {
        return num.toFixed(10);
      }
    }

    function formatTokenAmount(num) {
      if (num >= 1000000) {
        return (num / 1000000).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'K';
      } else {
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
    }

    function formatCurrency(num) {
      if (num >= 1000000) {
        return '$' + (num / 1000000).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'M';
      } else if (num >= 1000) {
        return '$' + (num / 1000).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'K';
      } else {
        return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
    }

    function calculateNormal() {
      const totalSupply = parseNumber(totalSupplyInput.value);
      const holdings = parseNumber(holdingsInput.value);

      if (isNaN(totalSupply) || totalSupply <= 0) {
        resultsContainer.innerHTML = `<p class="no-data">${translations[currentLang]['results.enterTotalSupply']}</p>`;
        return;
      }

      const hasHoldings = !isNaN(holdings) && holdings > 0;

      let html = `
        <table class="results-table">
          <thead>
            <tr>
              <th>${translations[currentLang]['results.normalTableHeader1']}</th>
              <th>${translations[currentLang]['results.normalTableHeader2']}</th>
              ${hasHoldings ? `<th>${translations[currentLang]['results.normalTableHeader3']}</th>` : ''}
            </tr>
          </thead>
          <tbody>
      `;

      fdvList.forEach(fdv => {
        const price = fdv.value / totalSupply;
        const holdingValue = hasHoldings ? price * holdings : 0;

        html += `
          <tr>
            <td class="fdv-label">${fdv.label}</td>
            <td class="price-value">$${formatNumber(price)}</td>
            ${hasHoldings ? `<td class="holding-value">${formatCurrency(holdingValue)}</td>` : ''}
          </tr>
        `;
      });

      html += '</tbody></table>';
      resultsContainer.innerHTML = html;
    }

    function calculatePoint() {
      const totalSupply = parseNumber(totalSupplyPointInput.value);
      const totalPoints = parseNumber(totalPointsInput.value);
      const allocation = parseNumber(allocationPointInput.value);
      const myPoints = parseNumber(myPointsInput.value);

      if (isNaN(totalPoints) || isNaN(allocation) || totalPoints <= 0 || allocation <= 0) {
        resultsContainer.innerHTML = `<p class="no-data">${translations[currentLang]['results.enterPointData']}</p>`;
        return;
      }

      const hasMyPoints = !isNaN(myPoints) && myPoints > 0;
      const hasTotalSupply = !isNaN(totalSupply) && totalSupply > 0;
      
      // 自分の獲得トークン数を計算（総供給量がある場合のみ）
      const myTokens = (hasMyPoints && hasTotalSupply) ? totalSupply * (allocation / 100) * (myPoints / totalPoints) : 0;

      let html = '';
      
      // 獲得トークン数の表示（総供給量と自分のポイントがある場合のみ）
      if (hasMyPoints && hasTotalSupply) {
        html += `
          <div style="background: rgba(192, 132, 252, 0.1); border: 1px solid rgba(192, 132, 252, 0.3); border-radius: 10px; padding: 16px; margin-bottom: 20px;">
            <div style="font-size: 0.85rem; color: #a78bfa; margin-bottom: 4px;">${translations[currentLang]['results.yourTokens']}</div>
            <div style="font-size: 1.5rem; font-weight: 700; color: #c084fc; font-family: 'SF Mono', monospace;">${myTokens.toLocaleString('en-US', {maximumFractionDigits: 0})} ${translations[currentLang]['results.tokens']}</div>
          </div>
        `;
      }

      html += `
        <table class="results-table">
          <thead>
            <tr>
              <th>${translations[currentLang]['results.pointTableHeader1']}</th>
              <th>${translations[currentLang]['results.pointTableHeader2']}</th>
              ${hasMyPoints ? `<th>${translations[currentLang]['results.pointTableHeader3']}</th>` : ''}
            </tr>
          </thead>
          <tbody>
      `;

      fdvList.forEach(fdv => {
        // 1ポイントあたりの価格 = FDV × Allocation% ÷ 総配布ポイント
        const pricePerPoint = (fdv.value * (allocation / 100)) / totalPoints;
        const myValue = hasMyPoints ? pricePerPoint * myPoints : 0;

        html += `
          <tr>
            <td class="fdv-label">${fdv.label}</td>
            <td class="price-value">$${formatNumber(pricePerPoint)}</td>
            ${hasMyPoints ? `<td class="holding-value">${formatCurrency(myValue)}</td>` : ''}
          </tr>
        `;
      });

      html += '</tbody></table>';
      resultsContainer.innerHTML = html;
    }

    function calculate() {
      if (currentMode === 'normal') {
        calculateNormal();
      } else {
        calculatePoint();
      }
    }

    function formatInputWithCommas(input) {
      let value = input.value.replace(/,/g, '');
      if (value && !isNaN(value)) {
        const num = parseFloat(value);
        if (Number.isInteger(num)) {
          input.value = num.toLocaleString('en-US');
        } else {
          input.value = num.toLocaleString('en-US', { maximumFractionDigits: 10 });
        }
      }
    }

    // イベントリスナー
    totalSupplyInput.addEventListener('input', calculate);
    totalSupplyInput.addEventListener('blur', function() { formatInputWithCommas(this); });
    holdingsInput.addEventListener('input', calculate);
    holdingsInput.addEventListener('blur', function() { formatInputWithCommas(this); });

    totalSupplyPointInput.addEventListener('input', calculate);
    totalSupplyPointInput.addEventListener('blur', function() { formatInputWithCommas(this); });
    totalPointsInput.addEventListener('input', calculate);
    totalPointsInput.addEventListener('blur', function() { formatInputWithCommas(this); });
    allocationPointInput.addEventListener('input', calculate);
    myPointsInput.addEventListener('input', calculate);
    myPointsInput.addEventListener('blur', function() { formatInputWithCommas(this); });
  </script>
</body>
