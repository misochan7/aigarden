<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research | Crypto Tools by sasami</title>
  <meta name="description" content="sasamiのクリプトリサーチまとめ。プロジェクトごとに整理。各記事は投稿時点の情報です。">
  <meta property="og:title" content="Research | Crypto Tools by sasami">
  <meta property="og:description" content="sasamiのクリプトリサーチまとめ。プロジェクトごとに整理。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai-garden-lab.com/crypto/research/">
  <meta property="og:site_name" content="AIGARDEN">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f2ec;
      --text: #111111;
      --muted: #666666;
      --line: #1e1e1e;
      --accent: #0d5f66;
      --accent-light: rgba(13,95,102,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* ═══ HEADER ═══ */
    header {
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text);
      transition: opacity 0.2s;
    }
    .brand:hover { opacity: 0.65; }
    .diamond {
      width: 18px; height: 18px;
      background: var(--accent);
      transform: rotate(45deg);
      flex-shrink: 0;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 13px;
      align-items: center;
    }
    .nav-links a { color: var(--muted); transition: color 0.2s; letter-spacing: 0.02em; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); font-weight: 600; }

    /* ═══ HERO ═══ */
    .page-hero {
      padding: 48px 0 36px;
      border-bottom: 1px solid var(--line);
    }
    .page-hero h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .page-hero .subtitle { color: var(--muted); font-size: 0.9rem; }
    .disclaimer {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ═══ PROJECT LIST ═══ */
    .project-list {
      padding: 8px 0 0;
    }

    /* ============================================================
       ▼ 新しいプロジェクトを追加するときはここをコピー

       <div class="project">
         <div class="project-header">
           <h2 class="project-name">プロジェクト名</h2>
           <span class="project-tag">チェーン / カテゴリ</span>
         </div>
         <ul class="post-list">
           <li>
             <a href="ファイル名.html" class="post-link">
               <span class="post-title">タイトル</span>
               <span class="post-arrow">→</span>
             </a>
           </li>
         </ul>
       </div>

    ============================================================ -->

    .project {
      border-bottom: 1px solid var(--line);
      padding: 32px 0;
    }
    .project:last-child { border-bottom: none; }

    .project-header {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 14px;
    }
    .project-name {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .project-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .post-list {
      list-style: none;
      border-top: 1px solid rgba(30,30,30,0.1);
    }
    .post-list li {
      border-bottom: 1px solid rgba(30,30,30,0.1);
    }
    .post-list li:last-child { border-bottom: none; }

    .post-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 4px;
      transition: all 0.15s;
      gap: 16px;
    }
    .post-link:hover { padding-left: 10px; }
    .post-title {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
      transition: color 0.15s;
    }
    .post-link:hover .post-title { color: var(--accent); }
    .post-arrow {
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .post-link:hover .post-arrow { color: var(--accent); }

    /* ═══ FOOTER PROFILE ═══ */
    .profile-section {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      padding: 48px 0 64px;
      border-top: 1px solid var(--line);
      margin-top: 40px;
    }
    .profile-icon {
      width: 140px; height: 140px;
      overflow: hidden; flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .profile-icon img {
      width:100%; height:100%;
      object-fit:cover; object-position:center; display:block;
    }
    .profile-section h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: 48px; margin-bottom: 8px;
    }
    .profile-links {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;
    }
    .profile-links a {
      border: 1px solid var(--line);
      padding: 10px 18px; font-size: 13px; transition: all 0.2s;
    }
    .profile-links a:hover { background: var(--text); color: white; }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 640px) {
      .nav { flex-wrap: wrap; gap: 12px; }
      .nav-links { order: 3; width: 100%; gap: 16px; font-size: 12px; }
      .page-hero h1 { font-size: 2.4rem; }
      .profile-section { flex-direction: column; }
      .profile-icon { width: 96px; height: 96px; }
      .profile-section h2 { font-size: 38px; }
    }
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="container nav">
      <a href="/crypto/" class="brand">
        <div class="diamond"></div>
        <span>CRYPTO TOOLS</span>
        <span style="font-weight:400; opacity:.7;">BY SASAMI</span>
      </a>
      <nav class="nav-links">
        <a href="/crypto/fdv/">FDV Calculator</a>
        <a href="/crypto/prompt/">AI Prompts</a>
        <a href="/crypto/prediction/">Prediction</a>
        <a href="/crypto/research/" class="active">Research</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- HERO -->
      <div class="page-hero">
        <h1>Research.</h1>
        <p class="subtitle">プロジェクトのリサーチまとめ</p>
        <p class="disclaimer">⚠︎ 各記事は投稿時点の情報です。投資判断は自己責任でお願いします。</p>
      </div>

      <!-- ═══ PROJECTS ═══ -->
      <div class="project-list">

        <!-- ============================================================
          ▼ 新しいプロジェクトを追加するときはこのブロックをコピー＆ペースト
          ▼ 同じプロジェクトに記事を追加するときは <li> を1行足すだけ
        ============================================================ -->

        <div class="project">
          <div class="project-header">
            <h2 class="project-name">Percolator</h2>
            <span class="project-tag">Solana / DeFi</span>
          </div>
          <ul class="post-list">
            <li>
              <a href="percolator.html" class="post-link">
                <span class="post-title">Percolator — 誰でも作れるSolanaレバレッジ取引市場</span>
                <span class="post-arrow">→</span>
              </a>
            </li>
          </ul>
        </div>

      </div><!-- /project-list -->

      <!-- FOOTER PROFILE -->
      <section class="profile-section">
        <div class="profile-icon">
          <img src="../../images/pfp.png" alt="sasami profile" />
        </div>
        <div>
          <h2>sasami</h2>
          <div class="profile-links">
            <a href="https://x.com/neko_smg" target="_blank">X / Twitter →</a>
            <a href="https://note.com/" target="_blank">note →</a>
            <a href="https://ai-garden-lab.com/" target="_blank">AIGARDEN →</a>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <div class="container">© 2026 AIGARDEN Crypto Tools.</div>
  </footer>

</body>
</html>
