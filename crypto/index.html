<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Crypto Tools - 仮想通貨ツール集">
  <meta property="og:description" content="仮想通貨・暗号資産に役立つ無料ツール集。FDV計算、エアドロップ予測など。">

  <meta property="og:image" content="https://ai-garden-lab.com/images/cryptotools.png">
  <meta property="og:site_name" content="AIGARDEN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Crypto Tools - 仮想通貨ツール集">
  <meta name="twitter:description" content="仮想通貨・暗号資産に役立つ無料ツール集">
  <meta name="twitter:image" content="https://ai-garden-lab.com/images/cryptotools.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
      line-height: 1.6;
    }

    .top-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 言語切り替えトグル */
    .lang-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 1000;
    }

    .lang-label {
      font-size: 12px;
      color: #888;
      transition: color 0.2s;
    }

    .lang-label.active {
      color: #00d4ff;
      font-weight: 600;
    }

    .lang-switch {
      position: relative;
      width: 40px;
      height: 22px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lang-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .lang-switch.en::after {
      transform: translateX(18px);
    }

    .lang-switch.en {
      background: rgba(0, 212, 255, 0.3);
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      text-decoration: none;
      color: #aaa;
      transition: all 0.2s;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .nav-link.active {
      background: rgba(0, 212, 255, 0.15);
      color: #00d4ff;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header-banner {
      max-width: 100%;
      height: auto;
      margin-bottom: 12px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      color: white;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }

    .social-btn.twitter {
      background: #0ea5e9;
    }

    .social-btn.twitter:hover {
      background: #0284c7;
    }

    .social-btn.note {
      background: #41c9b4;
    }

    .social-btn.note:hover {
      background: #2eb8a3;
    }

    .subtitle {
      color: #fff;
      font-size: 1rem;
    }

    .tools-grid {
      display: grid;
      gap: 20px;
    }

    .tool-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .tool-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 212, 255, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .tool-icon svg {
      width: 24px;
      height: 24px;
      color: #00d4ff;
    }

    .tool-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }

    .tool-description {
      font-size: 0.9rem;
      color: #ddd;
      line-height: 1.6;
    }

    .tool-badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(0, 212, 255, 0.2);
      border-radius: 20px;
      font-size: 0.75rem;
      color: #00d4ff;
      margin-top: 12px;
    }

    .coming-soon {
      opacity: 0.5;
      pointer-events: none;
    }

    .coming-soon .tool-badge {
      background: rgba(255, 255, 255, 0.1);
      color: #666;
    }

    footer {
      text-align: center;
      padding: 50px 20px 30px;
      color: #aaa;
      font-size: 0.85rem;
    }

    footer a {
      color: #00d4ff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    footer a:hover {
      opacity: 0.8;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #ddd;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .footer-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 16px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .tool-card {
        padding: 20px;
      }

      .footer-links {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- 言語切り替えトグル -->
  <div class="lang-toggle">
    <span class="lang-label active" id="langJa">JP</span>
    <div class="lang-switch" id="langSwitch" onclick="toggleLanguage()"></div>
    <span class="lang-label" id="langEn">EN</span>
  </div>

  <div class="container">
    <header>
      <img src="/images/cryptotools.png" alt="Crypto Tools" class="header-banner">
      <div class="social-links">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          </svg>

        <a href="https://note.com/neko_smg" target="_blank" rel="noopener noreferrer" class="social-btn note">

            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          note
        </a>
      </div>
      <p class="subtitle" data-ja="仮想通貨・暗号資産に役立つ無料ツール集" data-en="Free tools for cryptocurrency & digital assets">仮想通貨・暗号資産に役立つ無料ツール集</p>
    </header>

    <div class="tools-grid">
      <a href="/crypto/fdv/" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>

          将来のFDVからトークン価格を予測。エアドロップのポイントから獲得トークン数と価値も計算できます。
        </div>
      </a>

      <a href="/crypto/prompt/" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="tool-title" data-ja="Crypto AIプロンプト集" data-en="Crypto AI Prompts">Crypto AIプロンプト集</div>
        <div class="tool-description" data-ja="Nansen・Surf・CMCなどのクリプト特化AIやClaude・ChatGPTなどで使える分析プロンプト集。" data-en="Analysis prompt collection for crypto-focused AI (Nansen, Surf, CMC) and Claude/ChatGPT.">
          Nansen・Surf・CMCなどのクリプト特化AIやClaude・ChatGPTなどで使える分析プロンプト集。
        </div>
      </a>


      <a href="/crypto/dashboard.html" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="tool-title" data-ja="Polymarket ######" data-en="Polymarket Dashboard">Polymarket ######</div>
        <div class="tool-description" data-ja="BTC/ETH########TGE########################################" data-en="Live prediction market dashboard. Track BTC/ETH price forecasts, pre-TGE tokens, war &amp; politics, and commodities.">
          BTC/ETH########TGE########################################

    </div>

    <footer>
      <div class="footer-links">
        <a href="/" class="footer-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span data-ja="AIGARDEN トップへ" data-en="AIGARDEN Home">AIGARDEN トップへ</span>
        </a>
      </div>
      <p>© 2025 <a href="/">AIGARDEN</a></p>
    </footer>
  </div>

  <script>
    // 言語設定の初期化
    function initLanguage() {
      const savedLang = localStorage.getItem('cryptoLang') || 'ja';
      if (savedLang === 'en') {
        applyLanguage('en');
      }
    }

    // 言語切り替え
    function toggleLanguage() {
      const currentLang = localStorage.getItem('cryptoLang') || 'ja';
      const newLang = currentLang === 'ja' ? 'en' : 'ja';
      localStorage.setItem('cryptoLang', newLang);
      applyLanguage(newLang);
    }

    // 言語適用
    function applyLanguage(lang) {
      const langSwitch = document.getElementById('langSwitch');
      const langJa = document.getElementById('langJa');
      const langEn = document.getElementById('langEn');

      if (lang === 'en') {
        langSwitch.classList.add('en');
        langJa.classList.remove('active');
        langEn.classList.add('active');
      } else {
        langSwitch.classList.remove('en');
        langJa.classList.add('active');
        langEn.classList.remove('active');
      }

      // data-ja / data-en 属性を持つ要素のテキストを切り替え
      document.querySelectorAll('[data-ja][data-en]').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });
    }

    // ページ読み込み時に言語設定を適用
    initLanguage();
  </script>
</body>
</html>
