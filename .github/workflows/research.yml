name: Research article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: research-${{ github.event.issue.number }}

jobs:
  write:
    # オーナー本人が作った research ラベル付きIssueだけ実行
    if: >-
      contains(github.event.issue.labels.*.name, 'research') &&
      github.event.issue.user.login == github.repository_owner &&
      (github.event.action == 'opened' || github.event.label.name == 'research')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Issue #${{ github.event.issue.number }} の本文に、Xポストの情報（プロジェクト名・URL・投稿日時・カテゴリ・本文など）があります。
            リポジトリ直下の CLAUDE.md のルールに厳密に従って、リサーチ記事を作成してください。

            - Web検索はしない。Issue本文に書いてある事実だけを使う
            - ブランチ research/{slug} を作り、1コミット（記事＋一覧ページ）で push する
            - main に直接 push しない
            - Pull Request を作成し、PR本文には次を書く：
              1. 追加・変更したファイル
              2. 「元ポストでは触れられていない」ため埋めなかった項目
              3. CLAUDE.md 末尾のチェックリストの結果
            - PR本文に「Closes #${{ github.event.issue.number }}」を入れる
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*)"
